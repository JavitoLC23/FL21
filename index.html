<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>21 de Septiembre</title>

  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at center, #182232 0%, #050811 100%);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    html {
      height: -webkit-fill-available;
    }

    /* PANTALLA DE ENTRADA OPTIMIZADA PARA CELULARES */
    #pantalla-inicio {
      position: absolute;
      z-index: 30;
      text-align: center;
      padding: 20px;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.8s ease, visibility 0.8s;
    }

    .fecha-top {
      font-size: 1.6rem;
      letter-spacing: 6px;
      color: rgba(255, 230, 100, 0.9);
      text-transform: uppercase;
      margin-bottom: 25px;
      font-weight: 300;
      text-shadow: 0 0 12px rgba(255, 215, 0, 0.4);
    }

    .banner-detalle {
      font-size: 1.05rem;
      color: #ffffff;
      letter-spacing: 2px;
      margin-bottom: 35px;
      font-weight: 400;
      opacity: 0.95;
    }

    /* BOTÓN TIPO ROSITA CON "VER AQUÍ" */
    .btn-rosa {
      background: linear-gradient(135deg, rgba(255, 230, 0, 0.25), rgba(255, 170, 0, 0.15));
      border: 1px solid rgba(255, 215, 0, 0.6);
      border-radius: 50px;
      padding: 12px 28px 12px 18px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.4);
      animation: pulso 2.2s infinite ease-in-out;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .btn-rosa:active {
      transform: scale(0.95);
    }

    .btn-rosa svg {
      width: 34px;
      height: 34px;
      filter: drop-shadow(0 0 6px rgba(255, 230, 0, 0.8));
    }

    .btn-rosa span {
      color: #ffffff;
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-shadow: 0 0 8px rgba(255, 230, 0, 0.6);
    }

    @keyframes pulso {
      0% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 215, 0, 0.4); }
      50% { transform: scale(1.05); box-shadow: 0 0 35px rgba(255, 215, 0, 0.7); }
      100% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 215, 0, 0.4); }
    }

    /* EXPERIENCIA DE FLORES */
    #experiencia {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 1.2s ease;
      z-index: 5;
    }

    .ramo-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 50vh;
      max-height: 450px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      transform: scale(0);
      transition: transform 1.6s cubic-bezier(0.175, 0.885, 0.32, 1.27);
      filter: drop-shadow(0 15px 30px rgba(0, 0, 0, 0.8));
    }

    svg.ramo-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* MENSAJE FINAL Y BOTONES */
    .mensaje-box {
      margin-top: 10px;
      text-align: center;
      padding: 0 20px;
      z-index: 10;
    }

    .linea-texto {
      font-family: 'Caveat', cursive;
      font-size: 2.2rem;
      color: #ffee66;
      text-shadow: 0 0 15px rgba(255, 230, 0, 0.8);
      margin: 4px 0;
      opacity: 0;
      transform: translateY(15px);
      transition: opacity 1.2s ease, transform 1.2s ease;
      line-height: 1.15;
    }

    .botones-grupo {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      opacity: 0;
      transition: opacity 1s ease;
    }

    .btn-accion {
      background: rgba(255, 230, 0, 0.15);
      border: 1px solid rgba(255, 230, 0, 0.5);
      color: #ffe600;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 0.9rem;
      cursor: pointer;
      backdrop-filter: blur(5px);
      transition: background 0.3s, transform 0.2s;
    }

    .btn-accion:active {
      transform: scale(0.96);
    }

    canvas#luces {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    @media (max-width: 480px) {
      .fecha-top { font-size: 1.3rem; letter-spacing: 4px; }
      .banner-detalle { font-size: 0.95rem; }
      .linea-texto { font-size: 1.8rem; }
      .ramo-container { height: 42vh; }
    }
  </style>
</head>
<body>

  <!-- AUDIO DE FONDO (SIN PRECARGA) -->
  <audio id="musicaFondo" loop preload="none">
    <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=soft-piano-10781.mp3" type="audio/mpeg">
  </audio>

  <!-- CANVAS EFECTOS -->
  <canvas id="luces"></canvas>

  <!-- PANTALLA INICIAL RESPONSIVE -->
  <div id="pantalla-inicio">
    <div class="fecha-top">2 1  D E  S E P T I E M B R E</div>
    <div class="banner-detalle">🎁 ·· UN DETALLE ESPECIAL PARA TI ·· 🎁</div>
    
    <button class="btn-rosa" onclick="mostrarSorpresa()">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M32 58 C32 45 30 38 32 30" stroke="#38a356" stroke-width="3" stroke-linecap="round"/>
        <path d="M32 46 Q24 44 20 38 Q28 38 32 44" fill="#38a356"/>
        <path d="M32 40 Q40 38 44 32 Q36 32 32 38" fill="#38a356"/>
        <path d="M32 12 C20 12 16 24 24 30 C32 36 40 30 48 24 C52 16 44 12 32 12 Z" fill="#ffaa00"/>
        <path d="M22 18 C16 22 20 32 28 32 C36 32 44 26 42 18 C36 12 28 14 22 18 Z" fill="#ffcc00"/>
        <path d="M26 20 C24 24 28 28 32 28 C36 28 40 24 38 20 C36 16 28 16 26 20 Z" fill="#ffee66"/>
        <circle cx="32" cy="21" r="3" fill="#ff8800"/>
      </svg>
      <span>Ver aquí</span>
    </button>
  </div>

  <!-- PANTALLA PRINCIPAL CON RAMO -->
  <div id="experiencia">
    <div class="ramo-container" id="ramo">
      <svg class="ramo-svg" viewBox="0 0 600 700">
        <defs>
          <radialGradient id="gradPetalo1" cx="50%" cy="85%" r="85%">
            <stop offset="0%" stop-color="#ff8800" />
            <stop offset="40%" stop-color="#ffcc00" />
            <stop offset="100%" stop-color="#ffffcc" />
          </radialGradient>
          <radialGradient id="gradPetalo2" cx="50%" cy="85%" r="85%">
            <stop offset="0%" stop-color="#d96b00" />
            <stop offset="50%" stop-color="#ffaa00" />
            <stop offset="100%" stop-color="#fffae6" />
          </radialGradient>
          <radialGradient id="gradCentro" cx="40%" cy="40%" r="70%">
            <stop offset="0%" stop-color="#542803" />
            <stop offset="65%" stop-color="#2b1200" />
            <stop offset="100%" stop-color="#0f0500" />
          </radialGradient>
          <linearGradient id="gradHoja" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38a356" />
            <stop offset="100%" stop-color="#0d3b18" />
          </linearGradient>
          <linearGradient id="gradPapel" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#d4a373" />
            <stop offset="50%" stop-color="#bc8a5f" />
            <stop offset="100%" stop-color="#8b5e34" />
          </linearGradient>

          <g id="girasol">
            <g fill="url(#gradPetalo2)">
              <path d="M200,200 C185,100 215,100 200,200" transform="rotate(0 200 200)" />
              <path d="M200,200 C185,100 215,100 200,200" transform="rotate(30 200 200)" />
              <path d="M200,200 C185,100 215,100 200,200" transform="rotate(60 200 200)" />
              <path d="M200,200 C185,100 215,100 200,200" transform="rotate(90 200 200)" />
              <path d="M200,200 C185,100 215,100 200,200" transform="rotate(120 200 200)" />
              <path d="M200,200 C185,100 215,100 200,200" transform="rotate(150 200 200)" />
              <path d="M200,200 C185,100 215,100 200,200" transform="rotate(180 200 200)" />
              <path d="M200,200 C185,100 215,100 200,200" transform="rotate(210 200 200)" />
              <path d="M200,200 C185,100 215,100 200,200" transform="rotate(240 200 200)" />
              <path d="M200,200 C185,100 215,100 200,200" transform="rotate(270 200 200)" />
              <path d="M200,200 C185,100 215,100 200,200" transform="rotate(300 200 200)" />
              <path d="M200,200 C185,100 215,100 200,200" transform="rotate(330 200 200)" />
            </g>
            <g fill="url(#gradPetalo1)">
              <ellipse cx="200" cy="125" rx="15" ry="55" transform="rotate(15 200 200)" />
              <ellipse cx="200" cy="125" rx="15" ry="55" transform="rotate(45 200 200)" />
              <ellipse cx="200" cy="125" rx="15" ry="55" transform="rotate(75 200 200)" />
              <ellipse cx="200" cy="125" rx="15" ry="55" transform="rotate(105 200 200)" />
              <ellipse cx="200" cy="125" rx="15" ry="55" transform="rotate(135 200 200)" />
              <ellipse cx="200" cy="125" rx="15" ry="55" transform="rotate(165 200 200)" />
              <ellipse cx="200" cy="125" rx="15" ry="55" transform="rotate(195 200 200)" />
              <ellipse cx="200" cy="125" rx="15" ry="55" transform="rotate(225 200 200)" />
              <ellipse cx="200" cy="125" rx="15" ry="55" transform="rotate(255 200 200)" />
              <ellipse cx="200" cy="125" rx="15" ry="55" transform="rotate(285 200 200)" />
              <ellipse cx="200" cy="125" rx="15" ry="55" transform="rotate(315 200 200)" />
              <ellipse cx="200" cy="125" rx="15" ry="55" transform="rotate(345 200 200)" />
            </g>
            <circle cx="200" cy="200" r="42" fill="url(#gradCentro)" stroke="#ffaa00" stroke-width="2" />
          </g>
        </defs>

        <polygon points="180,680 420,680 520,380 80,380" fill="url(#gradPapel)" />
        <g stroke="#1a532c" stroke-width="12" stroke-linecap="round">
          <path d="M300,650 Q280,450 140,240" />
          <path d="M300,650 Q300,450 460,240" />
          <path d="M300,650 L300,180" />
        </g>
        <g fill="url(#gradHoja)">
          <path d="M270,520 Q120,480 100,380 Q200,510 270,520" />
          <path d="M330,520 Q480,480 500,380 Q400,510 330,520" />
        </g>

        <use href="#girasol" x="-130" y="-40" transform="scale(1)" />
        <use href="#girasol" x="180" y="-50" transform="scale(1)" />
        <use href="#girasol" x="25" y="-140" transform="scale(1.1)" />
        <use href="#girasol" x="25" y="30" transform="scale(1.3)" />
      </svg>
    </div>

    <div class="mensaje-box">
      <div id="txt1" class="linea-texto">Que la alegría de estas flores te acompañe siempre.</div>
      <div id="txt2" class="linea-texto">¡Feliz Comienzo de la Primavera! ✨</div>

      <div class="botones-grupo" id="grupoBotones">
        <button class="btn-accion" onclick="cambiarFrase()">🎲 Ver Otra Frase</button>
      </div>
    </div>
  </div>

  <script>
    const frases = [
      ["Que la alegría de estas flores te acompañe siempre.", "¡Feliz Comienzo de la Primavera! ✨"],
      ["Las flores más hermosas florecen con amor.", "¡Que tengas un día brillante y lleno de luz! 💛"],
      ["Un detalle amarillo para iluminar tu día.", "Gracias por ser esa luz que llena todo de color. 🌼"]
    ];
    let indiceFrase = 0;

    const canvas = document.getElementById('luces');
    const ctx = canvas.getContext('2d');
    let width, height, elementos = [];

    function initCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      elementos = [];
      for(let i=0; i<30; i++) {
        elementos.push({
          x: Math.random() * width, y: Math.random() * height,
          r: Math.random() * 2.5 + 1, dx: (Math.random() - 0.5) * 0.5,
          dy: (Math.random() - 0.5) * 0.5, a: Math.random()
        });
      }
    }

    function renderAnimation() {
      ctx.clearRect(0, 0, width, height);
      elementos.forEach(p => {
        p.x += p.dx; p.y += p.dy;
        if (p.x < 0 || p.x > width) p.dx *= -1;
        if (p.y < 0 || p.y > height) p.dy *= -1;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 235, 120, ${Math.abs(Math.sin(p.a))})`;
        ctx.shadowBlur = 10; ctx.shadowColor = '#ffe600';
        ctx.fill(); p.a += 0.02;
      });
      requestAnimationFrame(renderAnimation);
    }

    window.addEventListener('resize', initCanvas);
    initCanvas(); renderAnimation();

    function mostrarSorpresa() {
      const inicio = document.getElementById('pantalla-inicio');
      const exp = document.getElementById('experiencia');
      const ramo = document.getElementById('ramo');
      const txt1 = document.getElementById('txt1');
      const txt2 = document.getElementById('txt2');
      const grupoBotones = document.getElementById('grupoBotones');
      const audio = document.getElementById('musicaFondo');

      // INICIA MÚSICA EXCLUSIVAMENTE AL HACER CLIC
      audio.volume = 0.5;
      audio.play().catch(() => {});

      inicio.style.opacity = '0';
      setTimeout(() => {
        inicio.style.visibility = 'hidden';
        exp.style.visibility = 'visible';
        exp.style.opacity = '1';

        setTimeout(() => { ramo.style.transform = 'scale(1)'; }, 200);
        setTimeout(() => { txt1.style.opacity = '1'; txt1.style.transform = 'translateY(0)'; }, 1200);
        setTimeout(() => { txt2.style.opacity = '1'; txt2.style.transform = 'translateY(0)'; }, 2200);
        setTimeout(() => { grupoBotones.style.opacity = '1'; }, 3200);
      }, 800);
    }

    function cambiarFrase() {
      indiceFrase = (indiceFrase + 1) % frases.length;
      const txt1 = document.getElementById('txt1');
      const txt2 = document.getElementById('txt2');

      txt1.style.opacity = '0';
      txt2.style.opacity = '0';

      setTimeout(() => {
        txt1.innerText = frases[indiceFrase][0];
        txt2.innerText = frases[indiceFrase][1];
        txt1.style.opacity = '1';
        txt2.style.opacity = '1';
      }, 500);
    }
  </script>
</body>
</html>
