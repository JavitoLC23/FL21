<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flores Amarillas de Primavera</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(ellipse at bottom, #111e2e 0%, #050811 100%);
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* PANTALLA INICIAL */
    #inicio {
      position: absolute;
      z-index: 10;
      text-align: center;
      transition: opacity 0.8s ease;
    }
    .titulo-inicio {
      font-size: 1.8rem;
      letter-spacing: 3px;
      margin-bottom: 25px;
      color: #fff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }
    .btn-regalo {
      background: linear-gradient(135deg, #ffd700, #ff9900);
      border: none;
      color: #0d0d0d;
      padding: 16px 36px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.6);
      transition: all 0.3s ease;
    }
    .btn-regalo:hover {
      transform: scale(1.08);
      box-shadow: 0 0 40px rgba(255, 215, 0, 0.9);
    }

    /* CANVAS DE FLORES Y EFECTOS */
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* MENSAJE SOBRE EL FONDO (SIN CUADRO) */
    #mensaje-container {
      position: absolute;
      bottom: 8%;
      width: 100%;
      text-align: center;
      z-index: 2;
      pointer-events: none;
      padding: 0 20px;
    }
    .mensaje-linea {
      font-family: 'Caveat', cursive;
      font-size: 2.8rem;
      color: #ffea00;
      text-shadow: 0 0 12px rgba(255, 234, 0, 0.7), 0 0 25px rgba(255, 180, 0, 0.4);
      margin: 8px 0;
      min-height: 3rem;
      letter-spacing: 1px;
    }

    @media (max-width: 768px) {
      .mensaje-linea {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>

  <!-- PANTALLA INICIAL -->
  <div id="inicio">
    <h2 class="titulo-inicio">🎁 ESTE DETALLE ES PARA TI 🎁</h2>
    <button class="btn-regalo" onclick="comenzar()">PRESIONA AQUÍ</button>
  </div>

  <!-- CANVAS Y TEXTO LIBRE -->
  <canvas id="canvasFlor"></canvas>
  
  <div id="mensaje-container">
    <div id="linea1" class="mensaje-linea"></div>
    <div id="linea2" class="mensaje-linea"></div>
  </div>

  <script>
    const canvas = document.getElementById('canvasFlor');
    const ctx = canvas.getContext('2d');
    
    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // PARTÍCULAS (Luciérnagas)
    const luciernagas = Array.from({ length: 45 }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      r: Math.random() * 2 + 1,
      dx: (Math.random() - 0.5) * 0.5,
      dy: (Math.random() - 0.5) * 0.5,
      alpha: Math.random()
    }));

    function animarLuciernagas() {
      luciernagas.forEach(p => {
        p.x += p.dx;
        p.y += p.dy;
        if (p.x < 0 || p.x > width) p.dx *= -1;
        if (p.y < 0 || p.y > height) p.dy *= -1;
        
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 235, 130, ${Math.abs(Math.sin(p.alpha))})`;
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#ffe600';
        ctx.fill();
        p.alpha += 0.02;
      });
    }

    // INICIO DE LA EXPERIENCIA
    function comenzar() {
      document.getElementById('inicio').style.opacity = '0';
      setTimeout(() => {
        document.getElementById('inicio').style.display = 'none';
        iniciarAnimacionRamo();
      }, 800);
    }

    // DIBUJO DEL RAMO DE FLORES
    function iniciarAnimacionRamo() {
      let progreso = 0;

      function loop() {
        ctx.clearRect(0, 0, width, height);
        animarLuciernagas();

        // Base/Origen del Ramo
        const baseX = width / 2;
        const baseY = height + 20;

        // Estructura de Flores del Ramo
        const florCentral = { x: baseX, y: height * 0.38, r: 50 };
        const florIzquierda = { x: baseX - 120, y: height * 0.45, r: 40 };
        const florDerecha = { x: baseX + 120, y: height * 0.43, r: 42 };
        const florArribaIzq = { x: baseX - 60, y: height * 0.28, r: 35 };
        const florArribaDer = { x: baseX + 70, y: height * 0.30, r: 38 };

        if (progreso < 1) progreso += 0.012;

        // 1. DIBUJAR HOJAS Y TALLOS (Progresivo)
        dibujarTalloCurvo(baseX, baseY, florCentral.x, florCentral.y, progreso, '#1e5e33', 10);
        dibujarTalloCurvo(baseX, baseY, florIzquierda.x, florIzquierda.y, progreso, '#184f2a', 8);
        dibujarTalloCurvo(baseX, baseY, florDerecha.x, florDerecha.y, progreso, '#184f2a', 8);
        dibujarTalloCurvo(baseX, baseY, florArribaIzq.x, florArribaIzq.y, progreso, '#24733e', 7);
        dibujarTalloCurvo(baseX, baseY, florArribaDer.x, florArribaDer.y, progreso, '#24733e', 7);

        // Hojas frondosas abajo
        if (progreso > 0.4) {
          dibujarHoja(baseX - 40, height * 0.7, -0.6, progreso);
          dibujarHoja(baseX + 40, height * 0.68, 0.6, progreso);
          dibujarHoja(baseX - 90, height * 0.62, -0.8, progreso);
          dibujarHoja(baseX + 90, height * 0.6, 0.8, progreso);
        }

        // 2. DIBUJAR FLORES (Aparecen al completar tallos)
        if (progreso >= 0.8) {
          const escalaFlor = Math.min((progreso - 0.8) * 5, 1);
          dibujarFlorGirasol(florIzquierda.x, florIzquierda.y, florIzquierda.r * escalaFlor);
          dibujarFlorGirasol(florDerecha.x, florDerecha.y, florDerecha.r * escalaFlor);
          dibujarFlorGirasol(florArribaIzq.x, florArribaIzq.y, florArribaIzq.r * escalaFlor);
          dibujarFlorGirasol(florArribaDer.x, florArribaDer.y, florArribaDer.r * escalaFlor);
          // Flor principal
          dibujarFlorGirasol(florCentral.x, florCentral.y, florCentral.r * escalaFlor);
          
          // Lazo decorativo al centro del ramo
          dibujarLazo(baseX, height * 0.78, escalaFlor);
        }

        if (progreso < 1) {
          requestAnimationFrame(loop);
        } else {
          setInterval(loop, 30); // Mantener animación de luces
          escribirTexto("Que la alegría de estas flores te acompañe siempre", "linea1", () => {
            escribirTexto("Que nunca falte en ti la alegría que tanto irradias ✨", "linea2");
          });
        }
      }
      loop();
    }

    // Funciones Auxiliares de Dibujo
    function dibujarTalloCurvo(x1, y1, x2, y2, p, color, grosor) {
      ctx.beginPath();
      ctx.strokeStyle = color;
      ctx.lineWidth = grosor;
      ctx.lineCap = 'round';
      ctx.moveTo(x1, y1);
      const cx = (x1 + x2) / 2 + (x1 > x2 ? -30 : 30);
      const cy = (y1 + y2) / 2;
      
      const currX = x1 + (x2 - x1) * p;
      const currY = y1 + (y2 - y1) * p;
      
      ctx.quadraticCurveTo(cx, cy, currX, currY);
      ctx.stroke();
    }

    function dibujarHoja(x, y, angulo, p) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angulo);
      ctx.beginPath();
      ctx.fillStyle = '#226b3a';
      ctx.ellipse(0, 0, 45 * p, 15 * p, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function dibujarFlorGirasol(x, y, radio) {
      if (radio <= 0) return;
      ctx.save();
      ctx.translate(x, y);

      const numPetalos = 12;
      ctx.shadowBlur = 18;
      ctx.shadowColor = '#ffea00';

      // Pétalos
      for (let i = 0; i < numPetalos; i++) {
        ctx.rotate((Math.PI * 2) / numPetalos);
        ctx.beginPath();
        let grad = ctx.createLinearGradient(0, 0, 0, -radio * 1.8);
        grad.addColorStop(0, '#ffa200');
        grad.addColorStop(0.5, '#ffee00');
        grad.addColorStop(1, '#fff7a3');
        
        ctx.fillStyle = grad;
        ctx.ellipse(0, -radio, radio * 0.38, radio * 0.9, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // Centro de la flor
      ctx.shadowBlur = 0;
      ctx.beginPath();
      let gradCentro = ctx.createRadialGradient(0, 0, 5, 0, 0, radio * 0.6);
      gradCentro.addColorStop(0, '#5e3205');
      gradCentro.addColorStop(1, '#2b1401');
      ctx.fillStyle = gradCentro;
      ctx.arc(0, 0, radio * 0.55, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function dibujarLazo(x, y, escala) {
      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = '#d90429';
      ctx.shadowBlur = 10;
      ctx.shadowColor = 'rgba(0,0,0,0.5)';
      
      // Lazos rojos decorativos
      ctx.beginPath();
      ctx.ellipse(-20 * escala, 0, 22 * escala, 12 * escala, -0.3, 0, Math.PI * 2);
      ctx.ellipse(20 * escala, 0, 22 * escala, 12 * escala, 0.3, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(0, 0, 8 * escala, 0, Math.PI * 2);
      ctx.fillStyle = '#ef233c';
      ctx.fill();
      ctx.restore();
    }

    // EFECTO TIPEADO (TYPEWRITER) PARA EL TEXTO
    function escribirTexto(texto, elementoId, callback) {
      let i = 0;
      const elem = document.getElementById(elementoId);
      const interval = setInterval(() => {
        elem.innerHTML += texto.charAt(i);
        i++;
        if (i >= texto.length) {
          clearInterval(interval);
          if (callback) setTimeout(callback, 400);
        }
      }, 50);
    }
  </script>
</body>
</html>
