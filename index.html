<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flores Amarillas de Primavera</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at center, #131c2e 0%, #050811 100%);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* PANTALLA INICIAL */
    #pantalla-inicio {
      position: absolute;
      z-index: 20;
      text-align: center;
      transition: opacity 0.8s ease, visibility 0.8s;
    }
    .subtitulo {
      font-size: 1.2rem;
      letter-spacing: 2px;
      color: #ffd700;
      margin-bottom: 25px;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
    }
    .btn-abrir {
      background: linear-gradient(135deg, #ffe000, #ff9900);
      color: #111;
      border: none;
      padding: 16px 38px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.6);
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .btn-abrir:hover {
      transform: scale(1.08);
      box-shadow: 0 0 45px rgba(255, 215, 0, 0.9);
    }

    /* PANTALLA PRINCIPAL */
    #experiencia {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 1.5s ease;
      z-index: 5;
    }

    /* ESCENARIO DEL RAMO */
    .ramo-container {
      position: relative;
      width: 480px;
      max-width: 90vw;
      height: 520px;
      max-height: 55vh;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      transform: scale(0);
      transition: transform 1.8s cubic-bezier(0.175, 0.885, 0.32, 1.27);
      filter: drop-shadow(0 0 25px rgba(255, 230, 0, 0.35));
    }

    /* ESTILO SVG FLORES */
    svg.ramo-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* TEXTO MEJORADO Y LIMPIO (SIN CUADRO) */
    .mensaje-box {
      margin-top: 15px;
      text-align: center;
      padding: 0 20px;
      z-index: 10;
    }
    .linea-texto {
      font-family: 'Caveat', cursive;
      font-size: 2.6rem;
      color: #ffee66;
      text-shadow: 0 0 15px rgba(255, 230, 0, 0.8), 0 0 25px rgba(255, 170, 0, 0.4);
      margin: 6px 0;
      opacity: 0;
      transform: translateY(15px);
      transition: opacity 1.2s ease, transform 1.2s ease;
      line-height: 1.2;
    }

    /* PÁRTICULAS / LUCIÉRNAGAS */
    canvas#luces {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    @media (max-width: 600px) {
      .linea-texto {
        font-size: 1.9rem;
      }
      .ramo-container {
        height: 420px;
      }
    }
  </style>
</head>
<body>

  <!-- FONDO DE LUCES -->
  <canvas id="luces"></canvas>

  <!-- PANTALLA INICIAL -->
  <div id="pantalla-inicio">
    <div class="subtitulo">🎁 ESTE DETALLE ES PARA TI 🎁</div>
    <button class="btn-abrir" onclick="mostrarSorpresa()">PRESIONA AQUÍ</button>
  </div>

  <!-- PANTALLA FLOR Y TEXTO -->
  <div id="experiencia">
    <div class="ramo-container" id="ramo">
      <!-- RAMO DE FLORES SVG VECTORIAL DETALLADO -->
      <svg class="ramo-svg" viewBox="0 0 500 600">
        <defs>
          <!-- GRADIENTES PÉTALOS -->
          <radialGradient id="gradPetalo1" cx="50%" cy="80%" r="80%">
            <stop offset="0%" stop-color="#ff9900" />
            <stop offset="50%" stop-color="#ffea00" />
            <stop offset="100%" stop-color="#ffffaa" />
          </radialGradient>
          <radialGradient id="gradPetalo2" cx="50%" cy="80%" r="80%">
            <stop offset="0%" stop-color="#e67e00" />
            <stop offset="60%" stop-color="#ffd700" />
            <stop offset="100%" stop-color="#fff8b3" />
          </radialGradient>
          <!-- GRADIENTE CENTRO FLOR -->
          <radialGradient id="gradCentro" cx="40%" cy="40%" r="60%">
            <stop offset="0%" stop-color="#6a3805" />
            <stop offset="70%" stop-color="#3a1c02" />
            <stop offset="100%" stop-color="#1a0a00" />
          </radialGradient>
          <!-- GRADIENTE HOJAS -->
          <linearGradient id="gradHoja" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2d8a4e" />
            <stop offset="100%" stop-color="#113d20" />
          </linearGradient>
          <!-- DEGRADADO LAZO -->
          <linearGradient id="gradLazo" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#d90429" />
            <stop offset="50%" stop-color="#ff4d6d" />
            <stop offset="100%" stop-color="#b7094c" />
          </linearGradient>

          <!-- PLANTILLA DE GIRASOL/FLOR -->
          <g id="girasol">
            <!-- Pétalos Traseros -->
            <g fill="url(#gradPetalo2)">
              <path d="M200,200 C190,120 210,120 200,200" transform="rotate(0 200 200)" />
              <path d="M200,200 C190,120 210,120 200,200" transform="rotate(22.5 200 200)" />
              <path d="M200,200 C190,120 210,120 200,200" transform="rotate(45 200 200)" />
              <path d="M200,200 C190,120 210,120 200,200" transform="rotate(67.5 200 200)" />
              <path d="M200,200 C190,120 210,120 200,200" transform="rotate(90 200 200)" />
              <path d="M200,200 C190,120 210,120 200,200" transform="rotate(112.5 200 200)" />
              <path d="M200,200 C190,120 210,120 200,200" transform="rotate(135 200 200)" />
              <path d="M200,200 C190,120 210,120 200,200" transform="rotate(157.5 200 200)" />
              <path d="M200,200 C190,120 210,120 200,200" transform="rotate(180 200 200)" />
              <path d="M200,200 C190,120 210,120 200,200" transform="rotate(202.5 200 200)" />
              <path d="M200,200 C190,120 210,120 200,200" transform="rotate(225 200 200)" />
              <path d="M200,200 C190,120 210,120 200,200" transform="rotate(247.5 200 200)" />
              <path d="M200,200 C190,120 210,120 200,200" transform="rotate(270 200 200)" />
              <path d="M200,200 C190,120 210,120 200,200" transform="rotate(292.5 200 200)" />
              <path d="M200,200 C190,120 210,120 200,200" transform="rotate(315 200 200)" />
              <path d="M200,200 C190,120 210,120 200,200" transform="rotate(337.5 200 200)" />
            </g>
            <!-- Pétalos Delanteros -->
            <g fill="url(#gradPetalo1)">
              <ellipse cx="200" cy="135" rx="14" ry="48" transform="rotate(11.25 200 200)" />
              <ellipse cx="200" cy="135" rx="14" ry="48" transform="rotate(33.75 200 200)" />
              <ellipse cx="200" cy="135" rx="14" ry="48" transform="rotate(56.25 200 200)" />
              <ellipse cx="200" cy="135" rx="14" ry="48" transform="rotate(78.75 200 200)" />
              <ellipse cx="200" cy="135" rx="14" ry="48" transform="rotate(101.25 200 200)" />
              <ellipse cx="200" cy="135" rx="14" ry="48" transform="rotate(123.75 200 200)" />
              <ellipse cx="200" cy="135" rx="14" ry="48" transform="rotate(146.25 200 200)" />
              <ellipse cx="200" cy="135" rx="14" ry="48" transform="rotate(168.75 200 200)" />
              <ellipse cx="200" cy="135" rx="14" ry="48" transform="rotate(191.25 200 200)" />
              <ellipse cx="200" cy="135" rx="14" ry="48" transform="rotate(213.75 200 200)" />
              <ellipse cx="200" cy="135" rx="14" ry="48" transform="rotate(236.25 200 200)" />
              <ellipse cx="200" cy="135" rx="14" ry="48" transform="rotate(258.75 200 200)" />
              <ellipse cx="200" cy="135" rx="14" ry="48" transform="rotate(281.25 200 200)" />
              <ellipse cx="200" cy="135" rx="14" ry="48" transform="rotate(303.75 200 200)" />
              <ellipse cx="200" cy="135" rx="14" ry="48" transform="rotate(326.25 200 200)" />
              <ellipse cx="200" cy="135" rx="14" ry="48" transform="rotate(348.75 200 200)" />
            </g>
            <!-- Centro con textura -->
            <circle cx="200" cy="200" r="38" fill="url(#gradCentro)" stroke="#ffaa00" stroke-width="2" />
            <circle cx="200" cy="200" r="30" fill="none" stroke="#220a00" stroke-width="3" stroke-dasharray="4,4" />
          </g>
        </defs>

        <!-- TALLOS Y HOJAS DEL RAMO -->
        <g stroke="#1a532c" stroke-width="10" stroke-linecap="round">
          <path d="M250,580 Q240,400 150,220" />
          <path d="M250,580 Q250,400 350,220" />
          <path d="M250,580 Q230,420 100,320" />
          <path d="M250,580 Q270,420 400,310" />
          <path d="M250,580 L250,180" />
        </g>

        <!-- HOJAS VERDES FRONDOSAS -->
        <g fill="url(#gradHoja)">
          <path d="M230,450 Q120,420 110,360 Q180,450 230,450" />
          <path d="M270,450 Q380,420 390,360 Q320,450 270,450" />
          <path d="M240,380 Q100,310 130,240 Q200,350 240,380" />
          <path d="M260,380 Q400,310 370,240 Q300,350 260,380" />
        </g>

        <!-- COMBO DE FLORES FORMANDO EL RAMO -->
        <!-- Flor Trasera Izquierda -->
        <use href="#girasol" x="-100" y="100" transform="scale(0.85)" />
        <!-- Flor Trasera Derecha -->
        <use href="#girasol" x="180" y="90" transform="scale(0.85)" />
        <!-- Flor Lateral Izquierda -->
        <use href="#girasol" x="-110" y="-10" transform="scale(0.9)" />
        <!-- Flor Lateral Derecha -->
        <use href="#girasol" x="150" y="-20" transform="scale(0.9)" />
        <!-- Flor Superior Central -->
        <use href="#girasol" x="25" y="-110" transform="scale(0.95)" />
        <!-- FLOR PRINCIPAL CENTRO -->
        <use href="#girasol" x="25" y="10" transform="scale(1.15)" />

        <!-- LAZO ROJO DECORATIVO -->
        <g id="lazo" fill="url(#gradLazo)">
          <path d="M250,460 C210,430 170,470 240,490 Z" />
          <path d="M250,460 C290,430 330,470 260,490 Z" />
          <circle cx="250" cy="475" r="12" fill="#ff4d6d" />
          <path d="M245,485 L220,560 L245,540 L250,485 Z" />
          <path d="M255,485 L280,560 L255,540 L250,485 Z" />
        </g>
      </svg>
    </div>

    <!-- MENSAJE LIMPIO SIN CUADRO -->
    <div class="mensaje-box">
      <div id="txt1" class="linea-texto">Que la alegría de estas flores te acompañe siempre.</div>
      <div id="txt2" class="linea-texto">Que nunca falte en ti la alegría que tanto irradias ✨</div>
    </div>
  </div>

  <script>
    // SISTEMA DE LUCES / LUCIÉRNAGAS EN CANVAS
    const canvas = document.getElementById('luces');
    const ctx = canvas.getContext('2d');
    let width, height, luciernagas = [];

    function initCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      luciernagas = Array.from({ length: 50 }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        r: Math.random() * 2.5 + 1,
        dx: (Math.random() - 0.5) * 0.6,
        dy: (Math.random() - 0.5) * 0.6,
        a: Math.random()
      }));
    }

    function renderLuces() {
      ctx.clearRect(0, 0, width, height);
      luciernagas.forEach(p => {
        p.x += p.dx;
        p.y += p.dy;
        if (p.x < 0 || p.x > width) p.dx *= -1;
        if (p.y < 0 || p.y > height) p.dy *= -1;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 235, 120, ${Math.abs(Math.sin(p.a))})`;
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#ffe600';
        ctx.fill();
        p.a += 0.025;
      });
      requestAnimationFrame(renderLuces);
    }

    window.addEventListener('resize', initCanvas);
    initCanvas();
    renderLuces();

    // INTERACCIÓN Y REVELADO PANTALLA
    function mostrarSorpresa() {
      const inicio = document.getElementById('pantalla-inicio');
      const exp = document.getElementById('experiencia');
      const ramo = document.getElementById('ramo');
      const txt1 = document.getElementById('txt1');
      const txt2 = document.getElementById('txt2');

      // 1. Ocultar botón inicial
      inicio.style.opacity = '0';
      setTimeout(() => {
        inicio.style.visibility = 'hidden';
        
        // 2. Mostrar contenedor principal
        exp.style.visibility = 'visible';
        exp.style.opacity = '1';

        // 3. Animación de crecimiento del ramo
        setTimeout(() => {
          ramo.style.transform = 'scale(1)';
        }, 300);

        // 4. Aparición elegante de las letras (Línea 1 y Línea 2)
        setTimeout(() => {
          txt1.style.opacity = '1';
          txt1.style.transform = 'translateY(0)';
        }, 1600);

        setTimeout(() => {
          txt2.style.opacity = '1';
          txt2.style.transform = 'translateY(0)';
        }, 3000);

      }, 800);
    }
  </script>
</body>
</html>
