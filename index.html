<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¡Flores Amarillas de Primavera! 🌼✨</title>
  
  <meta property="og:title" content="¡Tengo un detalle especial para ti! 🌼✨">
  <meta property="og:description" content="Abre este ramo interactivo de flores amarillas y recibe un mensaje especial.">
  <meta property="og:type" content="website">

  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at center, #182232 0%, #050811 100%);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* BARRA SUPERIOR DE CONTROLES */
    .top-bar {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 60;
      display: flex;
      gap: 10px;
    }
    .btn-control {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 230, 0, 0.4);
      color: #ffd700;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      backdrop-filter: blur(8px);
      transition: all 0.3s;
    }
    .btn-control:hover {
      background: rgba(255, 230, 0, 0.3);
      transform: scale(1.05);
    }

    /* PANTALLA INICIAL MEJORADA */
    #pantalla-inicio {
      position: absolute;
      z-index: 30;
      text-align: center;
      padding: 35px 25px;
      background: rgba(10, 15, 26, 0.65);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      border: 1px solid rgba(255, 215, 0, 0.25);
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
      max-width: 90%;
      width: 420px;
      transition: opacity 0.8s ease, visibility 0.8s;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .titulo-inicio {
      font-size: 1.8rem;
      font-weight: 700;
      color: #ffd700;
      margin-bottom: 25px;
      text-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
    }

    /* BOTÓN ESTILO ROSITA PEQUEÑA */
    .btn-rosa {
      background: linear-gradient(135deg, rgba(255, 230, 0, 0.2), rgba(255, 170, 0, 0.1));
      border: 1px solid rgba(255, 215, 0, 0.5);
      border-radius: 50px;
      padding: 10px 24px 10px 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.4);
      animation: pulso 2.2s infinite ease-in-out;
      transition: all 0.3s ease;
      backdrop-filter: blur(5px);
    }
    .btn-rosa:hover {
      transform: scale(1.08);
      background: linear-gradient(135deg, rgba(255, 230, 0, 0.35), rgba(255, 170, 0, 0.25));
      box-shadow: 0 0 40px rgba(255, 215, 0, 0.8);
    }
    .btn-rosa svg {
      width: 32px;
      height: 32px;
      filter: drop-shadow(0 0 6px rgba(255, 230, 0, 0.8));
    }
    .btn-rosa span {
      color: #ffffff;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-shadow: 0 0 8px rgba(255, 230, 0, 0.6);
    }

    @keyframes pulso {
      0% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 215, 0, 0.4); }
      50% { transform: scale(1.05); box-shadow: 0 0 35px rgba(255, 215, 0, 0.7); }
      100% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 215, 0, 0.4); }
    }

    /* PANTALLA PRINCIPAL */
    #experiencia {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 1.5s ease;
      z-index: 5;
    }

    /* CONTENEDOR DEL RAMO */
    .ramo-container {
      position: relative;
      width: 580px;
      max-width: 95vw;
      height: 560px;
      max-height: 58vh;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      transform: scale(0);
      transition: transform 1.8s cubic-bezier(0.175, 0.885, 0.32, 1.27);
      filter: drop-shadow(0 15px 35px rgba(0, 0, 0, 0.7));
      cursor: pointer;
    }

    svg.ramo-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* MENSAJES Y BOTONES */
    .mensaje-box {
      margin-top: 5px;
      text-align: center;
      padding: 0 20px;
      z-index: 10;
    }
    .linea-texto {
      font-family: 'Caveat', cursive;
      font-size: 2.8rem;
      color: #ffee66;
      text-shadow: 0 0 15px rgba(255, 230, 0, 0.8), 0 0 25px rgba(255, 170, 0, 0.4);
      margin: 2px 0;
      opacity: 0;
      transform: translateY(15px);
      transition: opacity 1.2s ease, transform 1.2s ease;
      line-height: 1.1;
    }

    .botones-grupo {
      margin-top: 15px;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      opacity: 0;
      transition: opacity 1s ease;
    }
    .btn-accion {
      background: rgba(255, 230, 0, 0.15);
      border: 1px solid rgba(255, 230, 0, 0.5);
      color: #ffe600;
      padding: 10px 22px;
      border-radius: 30px;
      font-size: 0.95rem;
      cursor: pointer;
      backdrop-filter: blur(5px);
      transition: all 0.3s ease;
    }
    .btn-accion:hover {
      background: rgba(255, 230, 0, 0.35);
      box-shadow: 0 0 20px rgba(255, 230, 0, 0.6);
      transform: scale(1.05);
    }
    .btn-fb {
      background: #1877f2;
      border: none;
      color: #fff;
    }
    .btn-fb:hover {
      background: #145dbf;
      box-shadow: 0 0 20px rgba(24, 119, 242, 0.6);
    }

    /* MARIPOSAS ANIMADAS */
    .mariposa {
      position: absolute;
      width: 40px;
      height: 40px;
      pointer-events: none;
      z-index: 12;
      animation: flotarMariposa 8s infinite ease-in-out;
    }
    .mariposa svg {
      width: 100%;
      height: 100%;
      animation: aleteo 0.35s infinite alternate ease-in-out;
    }

    @keyframes aleteo {
      0% { transform: scaleX(1); }
      100% { transform: scaleX(0.15); }
    }
    @keyframes flotarMariposa {
      0% { transform: translate(0, 0) rotate(0deg); }
      25% { transform: translate(70px, -50px) rotate(15deg); }
      50% { transform: translate(130px, 20px) rotate(-10deg); }
      75% { transform: translate(50px, -90px) rotate(20deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }

    canvas#luces {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    @media (max-width: 600px) {
      .linea-texto { font-size: 2.1rem; }
      .ramo-container { height: 420px; }
      .btn-accion { font-size: 0.85rem; padding: 8px 16px; }
    }
  </style>
</head>
<body>

  <!-- BARRA DE CONTROLES -->

    <!-- BOTÓN CON ROSITA Y TEXTO "VER AQUÍ" -->

  <!-- PANTALLA PRINCIPAL -->

    <!-- MARIPOSAS -->

    <!-- RAMO VECTORIAL -->

          <!-- GIRASOL HD MEJORADO -->

            <!-- Pétalos Capa 1 -->

              <path d="M200,200 C185,100 215,100 200,200" transform="rotate(20 200 200)" />
              <path d="M200,200 C185,100 215,100 200,200" transform="rotate(40 200 200)" />
              <path d="M200,200 C185,100 215,100 200,200" transform="rotate(60 200 200)" />

              <path d="M200,200 C185,100 215,100 200,200" transform="rotate(120 200 200)" />
              <path d="M200,200 C185,100 215,100 200,200" transform="rotate(140 200 200)" />
              <path d="M200,200 C185,100 215,100 200,200" transform="rotate(160 200 200)" />
              <path d="M200,200 C185,100 215,100 200,200" transform="rotate(180 200 200)" />
              <path d="M200,200 C185,100 215,100 200,200" transform="rotate(200 200 200)" />
              <path d="M200,200 C185,100 215,100 200,200" transform="rotate(220 200 200)" />
              <path d="M200,200 C185,100 215,100 200,200" transform="rotate(240 200 200)" />
              <path d="M200,200 C185,100 215,100 200,200" transform="rotate(260 200 200)" />
              <path d="M200,200 C185,100 215,100 200,200" transform="rotate(280 200 200)" />
              <path d="M200,200 C185,100 215,100 200,200" transform="rotate(300 200 200)" />
              <path d="M200,200 C185,100 215,100 200,200" transform="rotate(320 200 200)" />
              <path d="M200,200 C185,100 215,100 200,200" transform="rotate(340 200 200)" />
            </g>
            <!-- Pétalos Capa 2 -->
            <g fill="url(#gradPetalo1)">
              <ellipse cx="200" cy="125" rx="15" ry="55" transform="rotate(10 200 200)" />

              <ellipse cx="200" cy="125" rx="15" ry="55" transform="rotate(170 200 200)" />

            </g>
            <!-- Centro Realista -->
            <circle cx="200" cy="200" r="42" fill="url(#gradCentro)" stroke="#ffaa00" stroke-width="2" />
            <circle cx="200" cy="200" r="34" fill="none" stroke="#e67e00" stroke-width="3" stroke-dasharray="5,5" />

        <!-- ENVOLTORIO DE PAPEL KRAFT -->

      <div class="botones-grupo" id="grupoBotones">
        <button class="btn-accion" onclick="enviarAbrazo()">🌻 Enviar Abrazo (<span id="contadorAbrazos">154</span>)</button>
        <button class="btn-accion" onclick="cambiarFrase()">🎲 Ver Otra Frase</button>

  <script>
    const frases = [
      ["Que la alegría de estas flores te acompañe siempre.", "¡Feliz Comienzo de la Primavera para Todos! ✨"],
      ["Las flores más hermosas son las que florecen con amor.", "¡Que tengas un día brillante y lleno de luz! 💛"],
      ["Un detalle amarillo para iluminar tu día.", "Gracias por ser esa luz que llena todo de color. 🌼"],
      ["Que nunca te falte un motivo para sonreír.", "¡Feliz Día de las Flores Amarillas! 🌸🌿"]
    ];
    let indiceFrase = 0;
    let contadorAbrazos = 154;

    const canvas = document.getElementById('luces');
    const ctx = canvas.getContext('2d');
    let width, height, elementos = [];

    function initCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      elementos = [];
      for(let i=0; i<40; i++) {
        elementos.push({
          tipo: 'luz',
          x: Math.random() * width, y: Math.random() * height,
          r: Math.random() * 2.5 + 1, dx: (Math.random() - 0.5) * 0.5,
          dy: (Math.random() - 0.5) * 0.5, a: Math.random()
        });
      }
      for(let i=0; i<30; i++) {
        elementos.push({
          tipo: 'petalo',
          x: Math.random() * width, y: Math.random() * height,
          r: Math.random() * 6 + 4, dy: Math.random() * 1.2 + 0.6,
          dx: Math.sin(Math.random() * Math.PI) * 0.8, rot: Math.random() * 360
        });
      }
    }

    function renderAnimation() {
      ctx.clearRect(0, 0, width, height);
      elementos.forEach(p => {
        if(p.tipo === 'luz') {
          p.x += p.dx; p.y += p.dy;
          if (p.x < 0 || p.x > width) p.dx *= -1;
          if (p.y < 0 || p.y > height) p.dy *= -1;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 235, 120, ${Math.abs(Math.sin(p.a))})`;
          ctx.shadowBlur = 12; ctx.shadowColor = '#ffe600';
          ctx.fill(); p.a += 0.02;
        } else {
          p.y += p.dy; p.x += Math.sin(p.y * 0.02) * 0.6; p.rot += 1;
          if (p.y > height) { p.y = -10; p.x = Math.random() * width; }

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rot * Math.PI) / 180);
          ctx.beginPath();
          ctx.fillStyle = 'rgba(255, 220, 0, 0.75)';
          ctx.ellipse(0, 0, p.r, p.r * 1.8, 0, 0, Math.PI * 2);
          ctx.fill(); ctx.restore();
        }
      });
      requestAnimationFrame(renderAnimation);
    }

    window.addEventListener('resize', initCanvas);
    initCanvas(); renderAnimation();

    function mostrarSorpresa() {
      const inicio = document.getElementById('pantalla-inicio');
      const exp = document.getElementById('experiencia');
      const ramo = document.getElementById('ramo');
      const txt1 = document.getElementById('txt1');
      const txt2 = document.getElementById('txt2');
      const grupoBotones = document.getElementById('grupoBotones');
      const audio = document.getElementById('musicaFondo');

      // REPRODUCCIÓN DE MÚSICA RECIÉN AL PRESIONAR EL BOTÓN
      audio.volume = 0.4;
      audio.play().catch(() => {});

      inicio.style.opacity = '0';
      setTimeout(() => {
        inicio.style.visibility = 'hidden';
        exp.style.visibility = 'visible';
        exp.style.opacity = '1';

        setTimeout(() => { ramo.style.transform = 'scale(1)'; }, 300);
        setTimeout(() => { txt1.style.opacity = '1'; txt1.style.transform = 'translateY(0)'; }, 1500);
        setTimeout(() => { txt2.style.opacity = '1'; txt2.style.transform = 'translateY(0)'; }, 2700);
        setTimeout(() => { grupoBotones.style.opacity = '1'; }, 3800);
      }, 800);
    }

    function enviarAbrazo() {
      contadorAbrazos++;
      document.getElementById('contadorAbrazos').innerText = contadorAbrazos;
      
      for(let i=0; i<30; i++) {
        elementos.push({
          tipo: 'petalo',
          x: width / 2, y: height / 2,
          r: Math.random() * 8 + 4,
          dy: (Math.random() - 0.5) * 7,
          dx: (Math.random() - 0.5) * 7,
          rot: Math.random() * 360
        });
      }
    }

    function cambiarFrase() {
      indiceFrase = (indiceFrase + 1) % frases.length;
      const txt1 = document.getElementById('txt1');
      const txt2 = document.getElementById('txt2');

      txt1.style.opacity = '0';
      txt2.style.opacity = '0';

      setTimeout(() => {
        txt1.innerText = frases[indiceFrase][0];
        txt2.innerText = frases[indiceFrase][1];
        txt1.style.opacity = '1';
        txt2.style.opacity = '1';
      }, 500);
    }

    function compartirFB() {
      const url = encodeURIComponent(window.location.href);
      window.open(`https://www.facebook.com/sharer/sharer.php?u=${url}`, '_blank');
    }

    function toggleMusica() {
      const audio = document.getElementById('musicaFondo');
      const btn = document.getElementById('btnMusica');
      if (audio.paused) {
        audio.play();
        btn.innerText = '🔊 Música';
      } else {
        audio.pause();
        btn.innerText = '🔇 Silencio';
      }
    }

    function crearEstallidoPetalos(e) {
      for(let i=0; i<15; i++) {
        elementos.push({
          tipo: 'petalo',
          x: e.clientX || width/2, y: e.clientY || height/2,
          r: Math.random() * 7 + 4,
          dy: (Math.random() - 0.5) * 5, dx: (Math.random() - 0.5) * 5,
          rot: Math.random() * 360
        });
      }
    }
  </script>
</body>
</html>
